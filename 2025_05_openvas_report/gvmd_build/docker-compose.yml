services:
  openvas-scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    image: local/openvas-runtime:latest
    container_name: openvas-scanner
    restart: unless-stopped
    environment:
      - TZ=UTC

  gvmd:
    build:
      context: .
      dockerfile: Dockerfile.gvmd
    image: local/gvmd-runtime:latest
    container_name: gvmd
    restart: unless-stopped
    volumes:
      - /opt/gvm/gvmd_socket:/run/gvmd   # host bind mount so host sees socket
      - gvmd_data:/var/lib/gvm
      - gvmd_keys:/var/lib/openvas/gnupg
    environment:
      - TZ=UTC
      - GVMD_USER=admin
      - GVMD_PASSWORD=adminpassword
    depends_on:
      - openvas-scanner

volumes:
  gvmd_data:
  gvmd_keys:
