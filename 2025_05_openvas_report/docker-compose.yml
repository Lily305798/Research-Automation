services:
  init-redis:
    image: redis:7-alpine
    user: "root"
    volumes:
      - redis_socket:/run/redis
    command: ["chown", "-R", "999:1001", "/run/redis"]
  mqtt-broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./pentest-greenbone/mosquitto.conf:/mosquitto/config/mosquitto.conf
  redis-server:
    image: redis:7-alpine  # Lightweight official image
    user: "redis:1001"     # Running with GID 1001 to match 'gvm' group
    volumes:
      - redis_socket:/run/redis
      - ./pentest-greenbone/redis.conf:/usr/local/etc/redis/redis.conf # Bringing in custom config file
    depends_on:
      init-redis:
        condition: service_completed_successfully
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  scanner:
    build: 
      context: pentest-greenbone/builder-runner
      dockerfile: Dockerfile
    environment:
      - GREENBONE_FEED_SYNC_FEED_RELEASE=22.04
    volumes:
      - redis_socket:/run/redis
      - ospd_socket:/run/ospd
      - ./pentest-greenbone/volumes/openvas:/var/lib/openvas:rw # Persistent data volume
      - ./pentest-greenbone/volumes/notus:/var/lib/notus:rw # Persistent data volume
      - ./pentest-greenbone/volumes/gvm:/var/lib/gvm:rw # Persistent data volume
    depends_on:
      - redis-server
    
  python-app:
    build:
      context: pentest-python-pipeline
    volumes:
      - ospd_socket:/run/ospd
    depends_on:
      - scanner

volumes:
  redis_socket: # "bridge" for the Unix socket
  ospd_socket: # "bridge"for the Python <-> Scanner communication