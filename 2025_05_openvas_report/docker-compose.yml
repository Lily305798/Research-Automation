services:
  gvmd:
    image: greenbone/gvmd-build:latest
    container_name: gvmd
    restart: unless-stopped
    volumes:
      - /opt/gvm/gvmd_socket:/run/gvmd
      - gvmd_data:/var/lib/gvm
      - gvmd_keys:/var/lib/openvas/gnupg
    environment:
      - TZ=UTC
      - GVMD_USER=admin
      - GVMD_PASSWORD=adminpassword
    depends_on:
      - openvas-scanner

  openvas-scanner:
    image: greenbone/openvas-scanner-build:latest
    container_name: openvas-scanner
    environment:
      - TZ=UTC

  gsa:
    image: greenbone/gsad-build:latest
    container_name: gsa
    ports:
      - "9392:9392"
    environment:
      - TZ=UTC
      - GVMD_SOCKET=/run/gvmd/gvmd.sock
    depends_on:
      - gvmd

volumes:
  gvmd_data:
  gvmd_keys:
